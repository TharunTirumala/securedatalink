services:
  - type: web
    name: securedatalink
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    disk:
      name: securelink-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
